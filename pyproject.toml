[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dispenser-conditioning-mcp"
version = "0.6.1"
description = "Pressure observation and bounded power-control MCP for dispenser conditioning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncua>=2.0.1,<3",
    "mcp>=2.0,<3",
    "pydantic>=2.12,<3",
    "py-siglent-spd3000",
]

[tool.uv.sources]
py-siglent-spd3000 = { path = "dependencies/py-siglent-spd3000", editable = true }

[project.scripts]
dispenser-conditioning-mcp = "dispenser_conditioning_mcp.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mcp[cli]>=2.0,<3",
    "pyright>=1.1.405,<2",
    "pytest>=9.0,<10",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dispenser_conditioning_mcp", "src/dispenser_simulator"]

[tool.hatch.build.targets.sdist]
include = [
    "/AGENTS.md",
    "/README.md",
    "/settings",
    "/deployment",
    "/docs",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]
exclude = [
    "/.codex-tmp",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/dependencies",
    "**/gateway-auth.toml",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["dependencies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
